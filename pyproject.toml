[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "designkit-process"
version = "0.1.0"
description = "Transform business processes into bounded AI-native agent operating models"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20,<5"]
license = "MIT"
[project.scripts]
designkit = "designkit.cli:main"
[tool.setuptools.packages.find]
include = ["designkit*"]
[tool.setuptools.package-data]
designkit = ["assets/**/*"]
